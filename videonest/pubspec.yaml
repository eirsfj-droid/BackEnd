name: videonest
description: A new Flutter project with Firebase support
publish_to: "none" 

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  share_plus: ^10.0.0
  intl: ^0.19.0
  # Firebase
  path_provider: ^2.0.0
  video_thumbnail: ^0.5.0
  image_picker: ^1.1.1
  file_picker: ^8.0.0
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9

  # Google Sign-In
  google_sign_in: ^6.1.5

  # Для видео
  video_player: ^2.8.6
  chewie: ^1.8.1

  # Для стилей и иконок
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
